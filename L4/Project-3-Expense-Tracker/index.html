
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyTrack - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MoneyTrack</h1>
    <p>Manage your money smartly</p>
  </header>

  <main class="container">
    <section class="summary">
      <div class="card balance">
        <p>Available Balance</p>
        <h2 id="balance">₹0.00</h2>
      </div>

      <div class="card income">
        <p>Total Income</p>
        <h2 id="income">₹0.00</h2>
      </div>

      <div class="card expense">
        <p>Total Expenses</p>
        <h2 id="expense">₹0.00</h2>
      </div>
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>

      <form id="transactionForm">
        <input id="title" placeholder="Transaction name" required>

        <input id="amount" type="number"
          placeholder="Amount" min="0.01" step="0.01" required>

        <select id="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <input type="date" id="date" required>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="history">
      <div class="history-header">
        <h2>Transaction History</h2>

        <select id="filter">
          <option value="all">All Transactions</option>
          <option value="income">Income Only</option>
          <option value="expense">Expenses Only</option>
        </select>
      </div>

      <div id="transactionList"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
