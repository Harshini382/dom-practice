
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>TaskFlow</h1>
    <p>Organize your work. Achieve your goals.</p>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat"><h2 id="total">0</h2><p>Total Tasks</p></div>
      <div class="stat"><h2 id="completed">0</h2><p>Completed</p></div>
      <div class="stat"><h2 id="pending">0</h2><p>Pending</p></div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Add New Task</h2>
      <form id="taskForm">
        <input id="taskName" placeholder="Enter task name" required>
        <select id="category">
          <option>Work</option>
          <option>Personal</option>
          <option>Study</option>
          <option>Other</option>
        </select>
        <select id="priority">
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <input type="date" id="dueDate" required>
        <button type="submit" id="submitBtn">Add Task</button>
        <button type="button" id="cancelEdit" hidden>Cancel</button>
      </form>
    </section>

    <section class="toolbar">
      <input id="search" placeholder="Search tasks...">
      <select id="filter">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option>Work</option>
        <option>Personal</option>
        <option>Study</option>
        <option>Other</option>
      </select>
    </section>

    <section id="taskList" class="task-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
