
<!DOCTYPE html>
<html>
<head>
    <title>Question 3</title>

    <style>
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <script>
        let firstItem = document.querySelector("li");

        firstItem.classList.add("highlight");
    </script>

</body>
</html>
