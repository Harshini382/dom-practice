
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery Filter</title>

    <style>
        .card {
            display: inline-block;
            margin: 10px;
            width: 200px;
            background: lightblue;
            padding: 10px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .hide {
            display: none;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <button data-filter="All">All</button>
    <button data-filter="Beaches">Beaches</button>
    <button data-filter="Mountains">Mountains</button>

    <br><br>

    <div class="card" data-category="Beaches">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"
             alt="Beach 1">
        <h3>Beach 1</h3>
    </div>

    <div class="card" data-category="Mountains">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400"
             alt="Mountain 1">
        <h3>Mountain 1</h3>
    </div>

    <div class="card" data-category="Beaches">
        <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=400"
             alt="Beach 2">
        <h3>Beach 2</h3>
    </div>

    <div class="card" data-category="Mountains">
        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=400"
             alt="Mountain 2">
        <h3>Mountain 2</h3>
    </div>

    <script>

        let buttons = document.querySelectorAll("[data-filter]");
        let cards = document.querySelectorAll(".card");

        buttons.forEach(function(button) {

            button.addEventListener("click", function() {

                let category = button.dataset.filter;

                cards.forEach(function(card) {

                    if (
                        category === "All" ||
                        card.dataset.category === category
                    ) {
                        card.classList.remove("hide");
                    } else {
                        card.classList.add("hide");
                    }

                });

            });

        });

    </script>

</body>
</html>
