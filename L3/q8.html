
<!DOCTYPE html>
<html>
<head>
    <title>Coffee Modal Popup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background-color: #f5eddf;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: #493326;
            font-size: 42px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #92745e;
            font-size: 15px;
            margin-top: -15px;
            margin-bottom: 30px;
            font-style: italic;
        }

        #openBtn {
            background: #ed893e;
            color: #fffaf2;
            border: none;
            padding: 15px 38px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #bd632d,
                        0 10px 18px rgba(90, 54, 31, 0.15);
            transition: 0.15s ease;
        }

        #openBtn:hover {
            background: #f39a50;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #bd632d,
                        0 13px 20px rgba(90, 54, 31, 0.18);
        }

        #openBtn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #bd632d;
        }

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(48, 32, 23, 0.55);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #modal {
            background: #fffaf0;
            width: 380px;
            max-width: 100%;
            padding: 45px 35px;
            border-radius: 22px;
            text-align: center;
            position: relative;
            border: 1px solid #e8d8c2;
            box-shadow: 0 20px 50px rgba(45, 29, 19, 0.25);
            animation: appear 0.3s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(15px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #closeBtn {
            position: absolute;
            top: 15px;
            right: 18px;
            background: transparent;
            border: none;
            color: #80634e;
            font-size: 26px;
            cursor: pointer;
        }

        #closeBtn:hover {
            color: #e77d36;
        }

        .line {
            width: 45px;
            height: 3px;
            background: #e88a43;
            margin: 0 auto 22px;
            border-radius: 5px;
        }

        #modal h2 {
            color: #493326;
            font-size: 30px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        #modal p {
            color: #806b59;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        #okBtn {
            background: #ed893e;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 13px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #bd632d;
            transition: 0.15s;
        }

        #okBtn:hover {
            background: #f39a50;
            transform: translateY(-2px);
        }

        #okBtn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #bd632d;
        }

    </style>
</head>

<body>

    <h1>Slow Mornings</h1>

    <p class="subtitle">A little pause in your busy day.</p>

    <button id="openBtn">Discover More</button>

    <div id="overlay">

        <div id="modal">

            <button id="closeBtn">×</button>

            <div class="line"></div>

            <h2>A Moment for You</h2>

            <p>
                Take a little break, slow down
                and enjoy the simple things.
                Sometimes the sweetest moments
                are the quietest ones.
            </p>

            <button id="okBtn">Sounds Lovely</button>

        </div>

    </div>

    <script>

        let overlay = document.getElementById("overlay");

        let modal = document.getElementById("modal");

        let openBtn = document.getElementById("openBtn");

        let closeBtn = document.getElementById("closeBtn");

        let okBtn = document.getElementById("okBtn");


        function openModal() {
            overlay.style.display = "flex";
        }

        function closeModal() {
            overlay.style.display = "none";
        }


        openBtn.addEventListener("click", openModal);

        closeBtn.addEventListener("click", closeModal);

        okBtn.addEventListener("click", closeModal);


        overlay.addEventListener("click", function(event) {

            if (event.target === overlay) {
                closeModal();
            }

        });


        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeModal();
            }

        });

    </script>

</body>
</html>
