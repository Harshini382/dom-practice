
<!DOCTYPE html>
<html>
<head>
    <title>Theme Toggle</title>

    <style>
        body {
            background-color: white;
            color: black;
            transition: 0.3s;
        }

        .dark {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Theme Toggle</h1>

    <p>Click the button to change the theme.</p>

    <button id="themeBtn">Dark / Light</button>

    <script>
        let button = document.getElementById("themeBtn");

        button.addEventListener("click", function() {
            document.body.classList.toggle("dark");
        });
    </script>

</body>
</html>
