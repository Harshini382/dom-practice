
<!DOCTYPE html>
<html>
<head>
    <title>Bike Image Gallery</title>
</head>
<body>

    <h2>Bike Image Gallery</h2>

    <img id="mainImage"
         src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800"
         width="400"
         alt="Main bike image">

    <br><br>

    <img class="thumbnail"
         data-src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800"
         src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=150"
         width="100"
         height="70"
         alt="Bike 1">

    <img class="thumbnail"
         data-src="https://images.unsplash.com/photo-1558981852-426c6c22a060?w=800"
         src="https://images.unsplash.com/photo-1558981852-426c6c22a060?w=150"
         width="100"
         height="70"
         alt="Bike 2">

    <img class="thumbnail"
         data-src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800"
         src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=150"
         width="100"
         height="70"
         alt="Bike 3">

    <script>
        let mainImage = document.getElementById("mainImage");

        let thumbnails = document.querySelectorAll(".thumbnail");

        thumbnails.forEach(function(thumbnail) {

            thumbnail.addEventListener("click", function() {

                mainImage.src = thumbnail.dataset.src;

            });

        });
    </script>

</body>
</html>
